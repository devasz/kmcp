[package]
name = "kmcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Out-of-band QEMU + kernel debugging MCP server (QMP + gdbstub RSP + serial; zero guest code)"
rust-version = "1.85"

[dependencies]
rmcp = { version = "=3.11.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
regex = "1"
libc = "0.2"
object = { version = "0.41", default-features = false, features = ["read", "std"] }
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "intel"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
object = { version = "0.41", default-features = false, features = ["write"] }
